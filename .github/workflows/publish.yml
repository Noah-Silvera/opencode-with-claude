name: Release

on:
  push:
    branches:
      - main
  # Manual run: publish the version on main if it is missing from npm, then
  # re-sync the Homebrew tap, without cutting a release.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  # Publishes through npm trusted publishing (OIDC): npm trusts this workflow
  # file, so no long-lived token is stored. A manual run publishes the version
  # on main if it never reached npm, which recovers a release whose publish
  # failed after release-please had already tagged it.
  publish:
    needs: release-please
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.release-please.result == 'success' && needs.release-please.outputs.release_created == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Check whether this version is already on npm
        id: check
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.check.outputs.published == 'false' }}

      - run: bun install --frozen-lockfile
        if: ${{ steps.check.outputs.published == 'false' }}

      - run: bun run build
        if: ${{ steps.check.outputs.published == 'false' }}

      - run: npm publish --access public --provenance
        if: ${{ steps.check.outputs.published == 'false' }}

  # Bump the formula in the dedicated tap (brew tap ianjwhite99/tap) to the
  # version that was just published. Needs a HOMEBREW_TAP_TOKEN secret: a
  # fine-grained PAT with "Contents: read and write" on
  # ianjwhite99/homebrew-tap. Skips with a warning if unset.
  homebrew-tap:
    needs: publish
    # Only once the tarball is on npm: waiting on one that was never published
    # just adds a second red job for one fault.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAP_REPO: ianjwhite99/homebrew-tap
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Update formula in Homebrew tap
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update"
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          scripts/update-homebrew-formula.sh tap/Formula/opencode-with-claude.rb "$VERSION"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/opencode-with-claude.rb
          if git diff --cached --quiet; then
            echo "Tap already at v$VERSION"
            exit 0
          fi
          git commit -m "opencode-with-claude: update to v$VERSION"
          git push
